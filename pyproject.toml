[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pah_spec"
version = "0.1.0"
description = "PAH Spectral model"
readme = "README.md"
authors = [{ name = "Helena Richie", email = "helenarichie@pitt.edu" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "astropy",
    "numpy",
    "pandas",
    "scipy",
]

[tool.setuptools]
# This tells python: "The root of my packages is inside the 'src' folder"
package-dir = {"" = "src"} 
packages = ["pah_spec"]

[tool.setuptools.package-data]
pah_spec = ["data/**/*", "data/*"]

